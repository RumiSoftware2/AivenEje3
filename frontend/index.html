<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRUD académico de pagos simulados de servicios.">
  <title>Pay Services | Pagos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true">P</div>
      <div><p class="eyebrow">GESTIÓN DE BASES DE DATOS</p><h1>Pay Services</h1></div>
    </header>
    <p class="subtitle">Registro académico de pagos simulados de servicios.</p>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Registrar pago</h2>
      <form id="payment-form">
        <div class="form-grid">
          <div class="field"><label for="cliente">Cliente</label><input id="cliente" name="cliente" type="text" maxlength="100" required></div>
          <div class="field"><label for="servicio">Servicio</label><select id="servicio" name="servicio" required><option value="" disabled selected>Selecciona un servicio</option><option>Agua</option><option>Energía</option><option>Internet</option><option>Gas</option><option>Telefonía</option><option>Otro</option></select></div>
          <div class="field"><label for="referencia">Referencia</label><input id="referencia" name="referencia" type="text" maxlength="60" required></div>
          <div class="field"><label for="valor">Valor (COP)</label><input id="valor" name="valor" type="number" min="0.01" step="0.01" inputmode="decimal" required></div>
          <div class="field"><label for="fecha_pago">Fecha</label><input id="fecha_pago" name="fecha_pago" type="date" required></div>
          <div class="field"><label for="estado">Estado</label><select id="estado" name="estado" required><option>Pendiente</option><option>Pagado</option></select></div>
        </div>
        <div class="form-actions"><button class="button button-primary" id="submit-button" type="submit">Guardar pago</button><button class="button" id="cancel-button" type="button" hidden>Cancelar edición</button></div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-heading"><div><h2 id="list-title">Pagos registrados</h2><p><span id="payment-count">0</span> registros</p></div><button class="button" id="refresh-button" type="button">Actualizar lista</button></div>
      <div class="message" id="message" role="status" aria-live="polite" hidden></div>
      <p class="loading" id="loading">Cargando pagos...</p>
      <p class="empty-state" id="empty-state" hidden>No hay pagos registrados.</p>
      <div class="table-scroll"><table><thead><tr><th>Cliente</th><th>Servicio</th><th>Referencia</th><th>Fecha</th><th>Valor</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="payment-list"></tbody></table></div>
    </section>

    <footer>Pay Services · Proyecto académico · Areandina</footer>
  </main>
</body>
</html>
